name: Keep Supabase Alive

on:
  schedule:
    # Runs at 00:00 UTC every day (07:00 WIB)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping_supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "Error: Secrets SUPABASE_URL and SUPABASE_ANON_KEY must be set in GitHub Settings."
            exit 1
          fi
          
          echo "Pinging Supabase to prevent pausing..."
          # Ping database (table profiles) to register activity
          curl -f -X GET "$SUPABASE_URL/rest/v1/profiles?select=count&limit=1" \
          -H "apikey: $SUPABASE_KEY" \
          -H "Authorization: Bearer $SUPABASE_KEY" \
          -H "Range: 0-0"
          
          echo "Ping successful!"
